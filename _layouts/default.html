<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <meta content="Arvinth S — Personal Portfolio" name="description">
    <meta name="google" content="notranslate" />
    <meta content="Arvinth S" name="author">

    <!-- Disable tap highlight on IE -->
    <meta name="msapplication-tap-highlight" content="no">

    <!-- <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-icon-180x180.png"> -->

    <title>{{page.title}}</title>

    <link href="/css/default.css" rel="stylesheet" type="text/css">
    <style>
      /* Homepage photo: one crop per screen shape (chosen in hero_crop_tool.html).
         Photo area = full width x 90% of window height; thresholds are window width/height. */
      .hero-full-container { background-position: center center !important; }
      @media (max-aspect-ratio: 62/100) { .hero-full-container { background-image: url('/img/hero/hero-phone.jpg') !important; } }
      @media (min-aspect-ratio: 62/100) and (max-aspect-ratio: 113/100) { .hero-full-container { background-image: url('/img/hero/hero-tabletP.jpg') !important; } }
      @media (min-aspect-ratio: 113/100) and (max-aspect-ratio: 164/100) { .hero-full-container { background-image: url('/img/hero/hero-tabletL.jpg') !important; } }
      @media (min-aspect-ratio: 164/100) and (max-aspect-ratio: 187/100) { .hero-full-container { background-image: url('/img/hero/hero-laptop.jpg') !important; } }
      @media (min-aspect-ratio: 230/100) { .hero-full-container { background-image: url('/img/hero/hero-ultrawide.jpg') !important; } }
      /* Typewriter line: smaller than "Hello, I am" so the long phrase fits; space reserved so nothing jumps */
      .hero-full-container h1 { min-height: 4.6em; }
      .hero-full-container #typed, .hero-full-container .typed-cursor { font-size: 0.8em; }
      @media (max-width: 767px) {
        .hero-full-container h1 { font-size: 44px; min-height: 6.2em; }
        .hero-full-container #typed, .hero-full-container .typed-cursor { font-size: 0.72em; }
      }
    </style>
    {% if site.google_analytics and jekyll.environment == 'production' %}
    {% include analytics.html %}
    {% endif %}

</head>

<body class="minimal">
    <header>
        <nav class="navbar  navbar-fixed-top navbar-inverse">
            <div class="container">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
                    data-target="#navbar-collapse" aria-expanded="false">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbar-collapse">
                    <ul class="nav navbar-nav ">
                        <li><a href="{{ site.baseurl }}/index.html" title="">01 : Home</a></li>
                        <li><a href="{{ site.baseurl }}/resume.html" title="">02 : Resume</a></li>
                        <li><a href="{{ site.baseurl }}/blog.html" title="">03 : Blog</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    {{content}}

    <footer class="footer-container text-center">
        <div class="container">
            <div class="row">
                <div class="col-xs-12">
                    <p>Be kind to all kinds</p>
                </div>
                <div class="col-xs-12">
                    <p>© Arvinth S 2026</p>
                </div>
                <div class="col-xs-12 text-right">
                    <p style="font-size: 0.85em; opacity: 0.8;">Website inspired from <a href="https://www.kylieying.com/" target="_blank" rel="noopener">Kylie Ying</a></p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function (event) {
            if (document.getElementById("typed")) type();
            movingBackgroundImage();
        });
    </script>


    <script type="text/javascript" src="/js/main.js"></script>
</body>

</html>
